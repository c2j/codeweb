# Regression test cases for local-variable false-positive call edge filtering.
#
# Each [case.<id>] section defines:
#   description       — what the case verifies
#   sql               — path to SQL fixture (relative to this file)
#   fixed_in          — version that fixed the bug
#   [[.expected_edges]] — expected graph edges (from, to, type)
#   expected_no_call_edges — if true, assert zero DirectCall/DynamicCall edges
#
# Scope: PL/SQL local identifiers (collection vars, scalars, record fields, FOR
# loop counters, parameters) used with paren syntax `name(args)` must NOT be
# mistaken for procedure/function calls. Distinct from the `function_call_edges`
# suite, which covers real call detection.

# ── Negative: collection index access NOT captured ────────────
# Bug: v_date(i) parses as Expr::FunctionCall; without a local symbol table
# built from DECLARE, the visitor cannot tell collection indexing from a call.

[case.collection_index_not_captured]
description = "PL/SQL collection index access (v_date(i), v_fund(i)) must NOT be a call edge"
sql = "cases/collection_index_not_captured.sql"
fixed_in = "v0.7.7"
expected_no_call_edges = true

# ── Mixed: real call captured alongside collection access ─────
# Same procedure body contains both a real function call (RHS assignment) and
# a collection index access in a SQL WHERE clause. The fix must keep the real
# edge while filtering the false positive.

[case.collection_index_with_real_call]
description = "Real function call captured alongside collection index access in SQL WHERE"
sql = "cases/collection_index_with_real_call.sql"
fixed_in = "v0.7.7"

[[case.collection_index_with_real_call.expected_edges]]
from = "clean_proc"
to = "compute_score"
type = "direct"

# ── Parameter scope: param names tracked like locals ─────────
# Same bug class, but the identifier arrives via the routine signature,
# not DECLARE. visit_statement must collect param names into local_vars.

[case.param_shadows_procedure]
description = "Procedure parameter indexed with paren syntax must NOT be a call edge"
sql = "cases/param_shadows_procedure.sql"
fixed_in = "v0.7.7"

[[case.param_shadows_procedure.expected_edges]]
from = "batch_check"
to = "real_target"
type = "direct"

# ── Scope isolation: locals don't leak across procedures ──────
# proc_a declares a local v_date (shadowing a global function of the same
# name); proc_b calls the global v_date function. The fix's local_vars.clear()
# on CreateProcedure entry must keep proc_b's real call intact.

[case.scope_reset_across_procedures]
description = "Local var in proc_a must not mask real call to same-named function in proc_b"
sql = "cases/scope_reset_across_procedures.sql"
fixed_in = "v0.7.7"

[[case.scope_reset_across_procedures.expected_edges]]
from = "proc_b"
to = "v_date"
type = "direct"

# ── TYPE name filter: constructors + member methods ──────────
# account_record_table() is a TYPE constructor (not a procedure call).
# obj_account_record.equals(...) is a member method on an object TYPE.
# Both parse as Expr::FunctionCall; the fix's known_types set
# (sourced from the global type_index) filters them alongside
# local collection index access aaa1(i) / aaa2(i).

[case.type_constructor_not_captured]
description = "TYPE constructor, member method call, and collection index access must NOT be call edges"
sql = "cases/type_constructor_not_captured.sql"
fixed_in = "v0.7.7"
expected_no_call_edges = true

# ── Package body scope bugs (pending fix) ─────────────────────
# collect_package_call_edges walks each item via walk_pl_block directly,
# bypassing visit_statement. local_vars is never cleared between items
# and parameters are never collected.

[case.pkg_body_scope_leak]
description = "Local var in proc_a leaks into proc_b — suppresses real call edge"
sql = "cases/pkg_body_scope_leak.sql"
fixed_in = "v0.7.7"

[[case.pkg_body_scope_leak.expected_edges]]
from = "proc_b"
to = "helper_fn"
type = "direct"

[case.pkg_body_param_not_captured]
description = "Package body parameter used with (index) spawns false Unresolved node"
sql = "cases/pkg_body_param_not_captured.sql"
fixed_in = "v0.7.7"
expected_no_call_edges = true

[case.nested_routine_scope_leak]
description = "Nested procedure's local var leaks into enclosing scope — suppresses real call edge"
sql = "cases/nested_routine_scope_leak.sql"
fixed_in = "v0.7.7"

[[case.nested_routine_scope_leak.expected_edges]]
from = "outer_proc"
to = "v_shadow"
type = "direct"

# ── PL/SQL block-local TYPE declarations ─────────────────────
# CallExtractor.visit_pl_declaration used to swallow PlDeclaration::Type
# via a catch-all arm, so TYPE names declared inside a DECLARE block never
# entered `known_types`. Constructor calls like `arr_type(...)` /
# `t_work_array()` parsed as Expr::FunctionCall and spawned false Unresolved
# nodes. Distinct from `type_constructor_not_captured`, which only covers
# top-level CREATE TYPE DDL.

[case.plsql_varray_type_constructor]
description = "PL/SQL block-local VARRAY TYPE constructor arr_type(...) must NOT be a call edge"
sql = "cases/plsql_varray_type_constructor.sql"
fixed_in = "v0.7.8"
expected_no_call_edges = true

[case.plsql_table_of_type_constructor]
description = "PL/SQL block-local TABLE OF TYPE constructor t_work_array() must NOT be a call edge"
sql = "cases/plsql_table_of_type_constructor.sql"
fixed_in = "v0.7.8"
expected_no_call_edges = true

# ── Package-level Variable/TYPE visibility ───────────────────
# collect_package_call_edges skipped PackageItem::Variable / Type, so
# package-level vars were absent from local_vars. Combined with
# visit_procedure_call lacking the local_vars/known_types filter, any
# collection indexing `pkg_var(i)` on a package-level associative array
# produced a false Unresolved node.

[case.plsql_index_by_pkg_variable]
description = "Package-level INDEX BY collection variable indexed with pkg_var(i) must NOT be a call edge"
sql = "cases/plsql_index_by_pkg_variable.sql"
fixed_in = "v0.7.8"
expected_no_call_edges = true
