[package]
name = "codeweb"
version = "0.9.9"
edition = "2021"
description = "Semantic code graph analyzer — call graphs for SQL stored procedures"
license = "MIT OR Apache-2.0"

[lib]
name = "codeweb"
path = "src/lib.rs"

[[bin]]
name = "codeweb"
path = "src/main.rs"
required-features = ["cli"]

[package.metadata.i18n]
available_locales = ["en", "zh-CN"]
default_locale = "zh-CN"
fallback_locale = "en"

[features]
# jsp：JSP 脚本块 + iBatis mapper 链（ogsql-parser 的 ibatis feature）
# java：tree-sitter Java 方法/类图 + ogsql-parser 的 Java SQL 抽取
# analyze：嵌入形态标记——SpinDuck 以 default-features = false + ["analyze"]
# 引入，得到无 CLI/TUI/serve/MCP/JSP/Java 的纯库构建（Task embed）。
# ogsql-parser / petgraph / 扫描类依赖（rayon/walkdir/globset/blake3/encoding_rs/
# indicatif）是任何可用形态的核心，保持非 optional，不进 feature。
default = ["cli", "tui", "jsp", "java"]
full = ["cli", "tui", "serve", "mcp", "jsp", "java", "analyze", "search-sql-v2"]
cli = ["dep:clap"]
tui = ["dep:ratatui", "dep:crossterm"]
serve = ["dep:axum", "dep:chrono", "dep:tokio", "dep:tower-http", "dep:rust-embed", "dep:mime_guess"]
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]
jsp = ["java", "ogsql-parser/ibatis"]
java = ["dep:tree-sitter", "dep:tree-sitter-java", "ogsql-parser/java"]
analyze = []
search-sql-v2 = []

[dependencies]
ogsql-parser = { git = "https://github.com/c2j/ogsql-parser", tag = "v0.11.0" }
petgraph = { version = "0.7", features = ["serde-1"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rayon = "1.10"
libc = "0.2"
walkdir = "2"
blake3 = "1"
globset = "0.4"
regex = { version = "1", default-features = false, features = ["std"] }
toml = "0.8"
bincode = "1"
bitflags = { version = "2", features = ["serde"] }
encoding_rs = "0.8"

clap = { version = "4", features = ["derive"], optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
axum = { version = "0.7", optional = true }
chrono = { version = "0.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"], optional = true }
rmcp = { version = "1.7", features = ["server", "transport-io"], optional = true }
schemars = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
csv = "1"
indicatif = "0.18.4"
pathdiff = "0.2.3"
rust-i18n = "3"

[dev-dependencies]
tempfile = "3"
minreq = { version = "2", features = ["https"] }
