[package]
name = "codeweb"
version = "0.1.0"
edition = "2021"
description = "Semantic code graph analyzer — call graphs for SQL stored procedures"

[dependencies]
ogsql-parser = { git = "https://github.com/c2j/ogsql-parser", features = ["ibatis", "java"] }
petgraph = "0.7"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tree-sitter = "0.24"
tree-sitter-java = "0.23"

[dev-dependencies]
tempfile = "3"
