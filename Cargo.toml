[package]
name = "codeweb"
version = "0.1.0"
edition = "2021"
description = "Semantic code graph analyzer — call graphs for SQL stored procedures"

[dependencies]
ogsql-parser = { git = "https://github.com/c2j/ogsql-parser", features = ["ibatis", "java"] }
petgraph = { version = "0.7", features = ["serde-1"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
walkdir = "2"
tree-sitter = "0.24"
tree-sitter-java = "0.23"
blake3 = "1"
globset = "0.4"
toml = "0.8"
bincode = "1"

[dev-dependencies]
tempfile = "3"
