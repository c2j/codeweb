<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>codeweb</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <span id="title">codeweb</span>
      <span id="project-name"></span>
      <div id="search-bar">
        <div id="search-mode-tabs">
          <span class="search-mode-tab active" data-mode="name" id="tab-name">Name</span>
          <span class="search-mode-tab" data-mode="sql" id="tab-sql">SQL</span>
        </div>
        <input type="text" id="search-input" placeholder="Search by name... (press /)">
        <span id="node-count"></span>
      </div>
    </div>
    <div id="content">
      <div id="node-panel">
        <div id="node-list"></div>
      </div>
      <div class="panel-divider" data-left="node-panel" data-right="detail-panel"></div>
      <div id="detail-panel" class="hidden">
        <div id="detail-header">
          <button id="detail-back" title="Back to previous node" style="display:none">&#8592;</button>
          <button id="detail-close">&times;</button>
          <span id="detail-title"></span>
        </div>
        <div id="detail-content"></div>
      </div>
    </div>
    <div id="stats-bar"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
