name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: codeweb-x86_64-unknown-linux-gnu
            executable: codeweb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: codeweb-aarch64-unknown-linux-gnu
            executable: codeweb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codeweb-x86_64-pc-windows-msvc
            executable: codeweb.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Windows: enable long paths to handle ogsql-parser submodules
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Build
        run: cargo build --release --features full --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --features full --target ${{ matrix.target }} -- --skip test_path_mapping_applied --skip test_serve_

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} dist/
          cp README.md dist/ 2>/dev/null; true
          cp LICENSE dist/ 2>/dev/null; true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create archives
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            if [ "$name" = "codeweb-x86_64-pc-windows-msvc" ]; then
              7z a "${name}.zip" "./${name}/"
            else
              tar czf "${name}.tar.gz" -C "${name}" .
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
